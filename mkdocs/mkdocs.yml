      - Keeping projects updated: guide/keeping-updated.md
      - The desktop app: guide/desktop.md
      - Authoring templates: guide/authoring-templates.md
      - Authoring pieces: guide/authoring-pieces.md
      - AI agents and MCP: guide/ai-agents.md
      - Multi-forge: guide/multi-forge.md
  - Architecture:
      - Organization architecture: architecture/index.md
  - Study:
      - I — Repository generation engine: study/engine-v1.md
      - II — Internal architecture & tech selection: study/engine-tech-v1.md
      - III — Execution model: study/engine-execution-v1.md
      - IV — Template forms: study/template-forms-v1.md
