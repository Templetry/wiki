site_name: Templetry wiki
site_description: Study & design wiki for Templetry — ADRs, specs, guides, research and journal.
site_url: https://templetry.github.io/wiki/
repo_url: https://github.com/Templetry/wiki
repo_name: Templetry/wiki
edit_uri: edit/main/

docs_dir: ..
site_dir: ../../site-build

exclude_docs: |
  .git/
  .github/
  mkdocs/
  requirements.txt
  LICENSE
  renovate.json
  .gitattributes
  .gitignore
  architecture/*.json

theme:
  name: material
  logo: brand/logo.svg
  favicon: brand/logo.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode (linen)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode (ink)
  font:
    text: Segoe UI
    code: Consolas
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit

extra_css:
  - stylesheets/ink-and-brass.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - State of the art: state-of-the-art.md
  - Guide:
      - Overview: guide/README.md
      - Getting started: guide/getting-started.md
